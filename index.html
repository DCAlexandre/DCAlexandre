<!doctype html>
<html lang="fr">
  <head>
    <!-- Meta -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="screen-orientation" content="portrait" />
    <meta name="orientation" content="portrait" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#3ECF8E" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alexandre Da Costa" />

    <!--
      Les balises title / description / canonical / Open Graph / Twitter sont
      gérées par page via le composant <Seo /> (métadonnées natives React 19).
      Celles ci-dessous servent uniquement de valeurs de secours (fallback).
    -->
    <meta name="author" content="Alexandre Da Costa" />
    <meta
      name="keywords"
      content="Alexandre Da Costa, Portfolio, Freelance, Développeur, Fullstack, Tech Lead, JavaScript, React, Node.js, DevOps, Leadership, Teamwork, Innovation, Architecture, Web Development, Frontend, Backend"
    />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <!-- title + meta description injectés par page via <Seo /> (React 19) -->

    <!-- Fonts -->
    <link
      rel="preload"
      href="/fonts/Nunito/Nunito-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Nunito/Nunito-Light.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Nunito/Nunito-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="apple-touch-icon" href="/icons/android-chrome-192x192.png" />

    <!-- Google tag (gtag.js) -->
    <link rel="preconnect" href="https://www.google-analytics.com" />
    <link rel="preconnect" href="https://region1.google-analytics.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://region1.google-analytics.com" />

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-VKXZ4K1QXZ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-VKXZ4K1QXZ");
    </script>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alexandre Da Costa",
        "jobTitle": "Tech Lead",
        "url": "https://kared-dev.fr/alexandre",
        "image": "https://kared-dev.fr/alexandre/assets/og-image.png",
        "description": "Tech Lead & Développeur fullstack en freelance, spécialisé en JavaScript, React et Node.js",
        "sameAs": [
          "https://www.linkedin.com/in/alexandre-dacosta",
          "https://www.malt.fr/profile/alexandredacosta1",
          "https://github.com/DCAlexandre"
        ],
        "knowsAbout": [
          "JavaScript",
          "React",
          "Node.js",
          "DevOps",
          "Leadership",
          "Architecture Logicielle",
          "Développement Web"
        ],
        "worksFor": [
          {
            "@type": "Organization",
            "name": "Comète",
            "description": "Lead Web Developer"
          },
          {
            "@type": "Organization",
            "name": "Freelance",
            "description": "Développeur Fullstack Freelance"
          },
          {
            "@type": "Organization",
            "name": "Kared Dev",
            "description": "Fondateur & Tech Lead"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
