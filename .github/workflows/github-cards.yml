name: GitHub cards

# Génère les cartes du profil et les publie sur la branche `output`, référencée
# par le README via raw.githubusercontent.com → aucun service tiers au runtime.
#
# Deux cartes :
#  - Snake  : animation de la grille de contributions (Platane/snk).
#  - Stats  : carte maison (scripts/github-stats-card.mjs) avec les chiffres
#             RÉELS, contributions privées incluses. On n'utilise plus
#             lowlighter/metrics car il n'expose que l'activité publique
#             (contributionsCollection) et sous-estime massivement un profil
#             majoritairement privé (PR, reviews, repos, langages…).

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 03:00 UTC
  workflow_dispatch: {} # déclenchement manuel (onglet Actions)

permissions:
  contents: write # nécessaire pour pousser sur la branche `output`

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare output dir
        run: mkdir -p dist

      # ----------------------------------------------------------------------
      # Snake — le serpent qui « mange » la grille de contributions (clair + sombre).
      # Doc : https://github.com/Platane/snk
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # ----------------------------------------------------------------------
      # Carte de stats maison — chiffres réels (privé + org inclus).
      # Le token doit voir les repos privés/org : scopes repo + read:org.
      - name: Generate stats card
        run: node scripts/github-stats-card.mjs dist/github-stats.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      # ----------------------------------------------------------------------
      # Publication de tout le dossier `dist` sur la branche `output`.
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
