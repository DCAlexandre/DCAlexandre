name: GitHub cards

# Génère les cartes du profil (Metrics + Snake) et les publie sur la branche
# `output`. Le README les référence via raw.githubusercontent.com → aucun
# service tiers au runtime, donc pas de 402/503 comme avec les instances Vercel
# publiques.

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 03:00 UTC
  workflow_dispatch: {} # déclenchement manuel (onglet Actions)

permissions:
  contents: write # nécessaire pour pousser sur la branche `output`

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p dist

      # ----------------------------------------------------------------------
      # Metrics — carte modulaire (activité, langages, calendrier 3D, achievements)
      # Doc & config : https://github.com/lowlighter/metrics
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: dist/github-metrics.svg
          output_action: none # on écrit juste le fichier, la publication se fait plus bas
          config_timezone: Europe/Paris
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full_year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_threshold: C

      # ----------------------------------------------------------------------
      # Snake — le serpent qui « mange » la grille de contributions (clair + sombre)
      # Doc : https://github.com/Platane/snk
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # ----------------------------------------------------------------------
      # Publication de tout le dossier `dist` sur la branche `output`
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
