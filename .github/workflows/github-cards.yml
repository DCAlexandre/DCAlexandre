name: GitHub cards

# Génère les cartes du profil (Metrics + Snake) et les publie sur la branche
# `output`. Le README les référence via raw.githubusercontent.com → aucun
# service tiers au runtime, donc pas de 402/503 comme avec les instances Vercel
# publiques.

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 03:00 UTC
  workflow_dispatch: {} # déclenchement manuel (onglet Actions)

permissions:
  contents: write # nécessaire pour pousser sur la branche `output`

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p dist

      # ----------------------------------------------------------------------
      # Snake — le serpent qui « mange » la grille de contributions (clair + sombre).
      # Action JS : écrit bien dans le workspace (dist/). Doc : https://github.com/Platane/snk
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # ----------------------------------------------------------------------
      # Publication du Snake sur la branche `output` (force-push : (re)crée la branche).
      # Doit précéder l'étape Metrics pour que la branche existe.
      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Metrics — carte modulaire (activité, langages, calendrier 3D, achievements).
      # Action Docker : elle NE dépose PAS de fichier dans le workspace, donc on la
      # laisse committer elle-même son SVG sur la branche `output` (commit par API :
      # ajoute github-metrics.svg sans écraser les fichiers Snake déjà publiés).
      # Doc & config : https://github.com/lowlighter/metrics
      - name: Generate & commit metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          output_action: commit
          committer_branch: output
          committer_message: "chore(metrics): mise à jour des statistiques"
          config_timezone: Europe/Paris
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full_year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_threshold: C
